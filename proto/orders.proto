syntax = "proto3";

package shop;

// Same operation as HTTP POST /orders, same business rules (app/shop.py) and same database.
service OrderService {
  rpc PlaceOrder (PlaceOrderRequest) returns (Order);
  rpc GetOrder (GetOrderRequest) returns (Order);  // read-only, same as HTTP GET /orders/{id}
}

message GetOrderRequest {
  int64 id = 1;
}

message PlaceOrderRequest {
  int32 product_id = 1;
  int32 quantity = 2;
  string card = 3;
  string idempotency_key = 4;  // optional; same key -> same order, charged once
}

message Order {
  int64 id = 1;
  int32 product_id = 2;
  int32 quantity = 3;
  double total = 4;
  string status = 5;
  bool replayed = 6;
}
